<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apex Run</title>
    <style>
      :root {
        --bg: #101513;
        --panel: #1a2421;
        --lime: #d3ef74;
        --paper: #f5f4e9;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; width: 100%; height: 100%;
        display: grid; place-items: center;
        background: linear-gradient(160deg, #0d1715, #162725);
        color: var(--paper);
        font-family: Arial, sans-serif;
      }
      .card {
        width: min(520px, calc(100vw - 32px));
        padding: 32px 28px;
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 18px;
        background: rgba(17, 26, 23, 0.9);
        text-align: center;
        box-shadow: 0 18px 40px rgba(0,0,0,0.28);
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 5vw, 3.2rem);
      }
      p {
        color: rgba(245,244,233,0.8);
        margin: 0 0 24px;
        line-height: 1.5;
      }
      .button {
        display: inline-block;
        padding: 16px 28px;
        border: none;
        border-radius: 12px;
        background: var(--lime);
        color: #101513;
        text-decoration: none;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        transition: transform 120ms ease, filter 120ms ease;
      }
      .button:hover { transform: translateY(-2px); filter: brightness(1.05); }
      .small {
        display: block;
        margin-top: 18px;
        font-size: 0.78rem;
        color: rgba(245,244,233,0.7);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Apex Run</h1>
      <p>Abra o jogo no navegador com um clique.</p>
      <a class="button" href="./dist/index.html" target="_blank">Jogar</a>
      <span class="small">Versão local para desktop</span>
    </div>
  </body>
</html>
